name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core Tests
            target: test-core
          - name: Poller Integration Tests
            target: test-poller
          - name: Parallel Integration Tests
            target: test-parallel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build cora and install local package link
        run: |
          make -j"$(nproc)" cora
          make install-local

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  bootstrap:
    name: Bootstrap Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare cora in PATH and install local package link
        run: |
          make -j"$(nproc)" cora
          make install-local
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Run bootstrap verification
        run: make bootstrap
